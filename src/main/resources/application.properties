spring.application.name=mymeet-backend


# =========================================================
# SERVER
# =========================================================

# Use the PORT supplied by the deployment platform.
# Fall back to 8080 for local development and Docker.
server.port=${PORT:8080}


# =========================================================
# WEBSOCKET / STOMP
# =========================================================

mymeet.websocket.endpoint=/ws

mymeet.websocket.application-prefix=/app

mymeet.websocket.broker-prefix=/topic


# =========================================================
# LOGGING
# =========================================================

logging.level.com.mymeet=INFO

logging.level.org.springframework.messaging=INFO

logging.level.org.springframework.web.socket.messaging=INFO